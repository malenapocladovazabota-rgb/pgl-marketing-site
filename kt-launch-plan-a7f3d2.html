<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>PGL Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F4F5F1;--carbon:#0D0E10;--carbon-soft:#17181C;--blue:#2038F0;--steel:#6E7178;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--carbon);color:var(--paper);
    font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;}
  .card{width:100%;max-width:380px;}
  .mark{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--steel);margin-bottom:26px;}
  h1{font-size:25px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin-bottom:9px;}
  .sub{font-size:14.5px;color:#9aa0a8;line-height:1.5;margin-bottom:26px;}
  label{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--steel);margin-bottom:8px;}
  input{width:100%;background:var(--carbon-soft);border:1.5px solid #2b2d33;border-radius:9px;
    color:var(--paper);font-size:16px;font-family:inherit;padding:13px 15px;outline:none;
    transition:border-color .16s ease;}
  input:focus{border-color:var(--blue);}
  button{width:100%;margin-top:12px;background:var(--blue);color:#fff;border:none;border-radius:9px;
    font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
    font-weight:500;padding:14px;cursor:pointer;transition:opacity .16s ease;}
  button:hover{opacity:.88;}
  button:disabled{opacity:.45;cursor:default;}
  .err{margin-top:14px;font-size:13.5px;color:#ff6b52;min-height:19px;}
  .foot{margin-top:30px;font-size:12px;color:#585d64;line-height:1.5;}
</style>
</head>
<body>
<div class="card">
  <div class="mark">PGL Marketing</div>
  <h1>K&amp;T Diagnostic</h1>
  <p class="sub">План запуска направления частных клиентов. Страница закрыта паролем.</p>
  <form id="f" autocomplete="off">
    <label for="p">Пароль</label>
    <input id="p" type="password" autocomplete="current-password" autofocus>
    <button id="b" type="submit">Открыть</button>
  </form>
  <div class="err" id="e"></div>
  <div class="foot">Если пароль не подходит, напишите Льву.</div>
</div>

function b64(s){
  var raw = atob(s), a = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
  return a;
}

document.getElementById('f').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var btn = document.getElementById('b'), err = document.getElementById('e');
  var pw = document.getElementById('p').value;
  if (!pw) return;
  btn.disabled = true; btn.textContent = 'Открываем...'; err.textContent = '';
  try {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(DATA.s), iterations:DATA.n, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var out = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(DATA.i)}, key, b64(DATA.c));
    var html = new TextDecoder().decode(out);
    document.open(); document.write(html); document.close();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Открыть';
    err.textContent = 'Неверный пароль';
    document.getElementById('p').value = '';
    document.getElementById('p').focus();
  }
});
